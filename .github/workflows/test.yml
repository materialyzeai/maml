name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [tests, release]
        default: tests
        description: Only run tests or release a new version to PyPI after tests pass.

jobs:
  test:

    strategy:
      max-parallel: 20
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}
    env:
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}
      # Pinned MLIP-3 commit built for the real-binary MTP tests.
      MLIP3_COMMIT: 7fe598da1de1e81d1ca222f4ab6b5d594278605c

    steps:
    - uses: actions/checkout@v6
    - name: Install uv with python version.
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: |
        uv sync
    - name: Cache MLIP-3
      id: cache-mlip3
      uses: actions/cache@v4
      with:
        path: ~/mlip-3/bin/mlp
        key: mlip3-${{ runner.os }}-${{ env.MLIP3_COMMIT }}
    - name: Build MLIP-3 (serial mlp)
      if: steps.cache-mlip3.outputs.cache-hit != 'true'
      run: |
        command -v gfortran || (sudo apt-get update && sudo apt-get install -y gfortran)
        git clone https://gitlab.com/ashapeev/mlip-3.git ~/mlip-3
        cd ~/mlip-3
        git checkout "$MLIP3_COMMIT"
        ./configure --no-mpi --blas=embedded
        make -j4 mlp
    - name: Add MLIP-3 to PATH
      run: |
        echo "$HOME/mlip-3/bin" >> "$GITHUB_PATH"
        "$HOME/mlip-3/bin/mlp" list | head -3
    - name: pytest
      run: |
        uv run pytest tests --cov=maml --cov-report=xml
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        slug: materialyzeai/maml
        fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.task == 'release')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # For pypi trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install uv with python version.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: |
          uv build
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
