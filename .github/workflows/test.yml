name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [tests, release]
        default: tests
        description: Only run tests or release a new version to PyPI after tests pass.

jobs:
  test:

    strategy:
      max-parallel: 20
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}
    env:
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}
      # Pinned MLIP-3 commit built for the real-binary MTP tests.
      MLIP3_COMMIT: 7fe598da1de1e81d1ca222f4ab6b5d594278605c

    steps:
    - uses: actions/checkout@v6
    - name: Install uv with python version.
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: |
        uv sync
    - name: Cache MLIP-3
      id: cache-mlip3
      uses: actions/cache@v4
      with:
        path: ~/mlip-3/bin/mlp
        key: mlip3-${{ runner.os }}-${{ env.MLIP3_COMMIT }}
    - name: Build MLIP-3 (serial mlp)
      if: steps.cache-mlip3.outputs.cache-hit != 'true'
      run: |
        command -v gfortran || (sudo apt-get update && sudo apt-get install -y gfortran)
        git clone https://gitlab.com/ashapeev/mlip-3.git ~/mlip-3
        cd ~/mlip-3
        git checkout "$MLIP3_COMMIT"
        ./configure --no-mpi --blas=embedded
        make -j4 mlp
    - name: Add MLIP-3 to PATH
      run: |
        echo "$HOME/mlip-3/bin" >> "$GITHUB_PATH"
        "$HOME/mlip-3/bin/mlp" list | head -3
    - name: pytest
      run: |
        uv run pytest tests --cov=maml --cov-report=xml
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        slug: materialyzeai/maml
        fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  mlip3-lammps:
    # End-to-end MTP tests against real MLIP-3 and LAMMPS built with MLIP-3's LAMMPS interface.
    # Kept out of the main job: its LAMMPS only has the MLIP pair style, so the SNAP/GAP/NNP
    # LAMMPS tests would fail there.
    runs-on: ubuntu-latest
    env:
      MLIP3_COMMIT: 7fe598da1de1e81d1ca222f4ab6b5d594278605c
      # interface-lammps-mlip-3 commit made for MLIP3_COMMIT.
      MLIP3_LAMMPS_COMMIT: 68f02dd9ee57279e58f5d0c6fd800fda9e0e8132
      LAMMPS_TAG: stable_29Aug2024_update4
    steps:
    - uses: actions/checkout@v6
    - name: Install uv with python version.
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: |
        uv sync
    - name: Cache MLIP-3 and LAMMPS
      id: cache-mlip3-lammps
      uses: actions/cache@v4
      with:
        path: ~/mlip3-bin
        key: mlip3-lammps-mpi-${{ runner.os }}-${{ env.MLIP3_COMMIT }}-${{ env.MLIP3_LAMMPS_COMMIT }}-${{ env.LAMMPS_TAG }}
    - name: Install OpenMPI
      run: |
        sudo apt-get update && sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin
    - name: Build MLIP-3 and LAMMPS with the MLIP-3 interface (MPI)
      if: steps.cache-mlip3-lammps.outputs.cache-hit != 'true'
      # MPI rather than serial: with --no-mpi, lib_mlip_interface.a bundles MLIP's own MPI stubs, which clash
      # at link time with LAMMPS's STUBS library and use incompatible MPI_Datatype codes.
      run: |
        build="$RUNNER_TEMP/mlip3-build"
        mkdir -p "$build" "$HOME/mlip3-bin"
        git clone https://gitlab.com/ashapeev/mlip-3.git "$build/mlip-3"
        git -C "$build/mlip-3" checkout "$MLIP3_COMMIT"
        (cd "$build/mlip-3" && ./configure --compiler=gnu --blas=embedded && make -j4 mlp libinterface)
        git clone https://gitlab.com/ivannovikov/interface-lammps-mlip-3.git "$build/interface"
        git -C "$build/interface" checkout "$MLIP3_LAMMPS_COMMIT"
        git clone --depth 1 -b "$LAMMPS_TAG" https://github.com/lammps/lammps.git "$build/lammps"
        cp "$build/mlip-3/lib/lib_mlip_interface.a" "$build/interface/"
        (cd "$build/interface" && sh ./preinstall.sh "$build/lammps")
        make -C "$build/lammps/src" -j4 mpi
        cp "$build/mlip-3/bin/mlp" "$build/lammps/src/lmp_mpi" "$HOME/mlip3-bin/"
    - name: Add MLIP-3 and LAMMPS to PATH
      run: |
        echo "$HOME/mlip3-bin" >> "$GITHUB_PATH"
        "$HOME/mlip3-bin/mlp" list | head -3
        # Fails if the interface was not compiled in (LAMMPS only warns about an unknown package).
        "$HOME/mlip3-bin/lmp_mpi" -h | grep -qw mlip
    - name: pytest
      run: |
        uv run pytest tests/apps/pes/test_mtp.py -rs

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.task == 'release')
    needs: [test, mlip3-lammps]
    runs-on: ubuntu-latest
    permissions:
      # For pypi trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install uv with python version.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: |
          uv build
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
